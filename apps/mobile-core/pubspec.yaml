name: mobile_core
description: "Core Server-Driven UI Mobile App Engine for App Maker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  http: ^1.2.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/app_config.json

  fonts:
    - family: Kalameh
      fonts:
        - asset: assets/fonts/kalameh/Kalameh-Regular.ttf
          weight: 400
        - asset: assets/fonts/kalameh/Kalameh-Medium.ttf
          weight: 500
        - asset: assets/fonts/kalameh/Kalameh-Bold.ttf
          weight: 700
        - asset: assets/fonts/kalameh/Kalameh-Black.ttf
          weight: 900
