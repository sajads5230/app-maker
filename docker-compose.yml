version: '3.8'

services:
  # 1. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: appmaker-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appmaker_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-appmaker_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appmaker} -d ${POSTGRES_DB:-appmaker_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 High-Performance Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: appmaker-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-appmaker_redis_secret_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-appmaker_redis_secret_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Web-based database management GUI (Adminer)
  adminer:
    image: adminer:latest
    container_name: appmaker-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Local S3-compatible Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: appmaker-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appmaker_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-appmaker_secure_s3_2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 5. Fastify Backend API Server (Node.js)
  api-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: appmaker-api-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-appmaker}:${POSTGRES_PASSWORD:-appmaker_secure_2026}@postgres:5432/${POSTGRES_DB:-appmaker_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-appmaker_redis_secret_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-app_maker_super_secret_jwt_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: appmaker_postgres_data
  redis_data:
    name: appmaker_redis_data
  minio_data:
    name: appmaker_minio_data
